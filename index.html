<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnHub - Watch, Complete & Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl">E</div>
      <span class="text-xl font-bold tracking-wide text-white">EarnHub</span>
    </div>
    <!-- Wallet Balance Header -->
    <div class="bg-gray-700 px-3 py-1.5 rounded-full flex items-center space-x-2 border border-gray-600">
      <i class="fas fa-coins text-yellow-400"></i>
      <span id="userCoins" class="font-bold text-yellow-400">300</span>
      <span class="text-xs text-gray-400">($<span id="userUsd">0.30</span>)</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Earnings Overview Card -->
    <div class="bg-gradient-to-r from-indigo-900 to-purple-900 p-5 rounded-2xl shadow-xl border border-indigo-700">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs uppercase font-semibold text-indigo-300 tracking-wider">Your Reward Wallet (30%)</p>
          <h2 class="text-3xl font-extrabold text-white mt-1"><span id="cardCoins">300</span> Coins</h2>
          <p class="text-sm text-indigo-200 mt-1">Value: $<span id="cardUsd">0.30</span> USD</p>
        </div>
        <div class="bg-indigo-600/50 p-3 rounded-xl border border-indigo-400/30">
          <i class="fas fa-wallet text-2xl text-indigo-200"></i>
        </div>
      </div>
      
      <!-- Progress Bar to Minimum Cash
